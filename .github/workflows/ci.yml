name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref; a new push cancels the in-flight run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gamedev_db
          POSTGRES_USER: gamedev_user
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamedev_user -d gamedev_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # WhiteNoise's manifest static storage (active whenever DEBUG is false)
      # refuses to serve without a staticfiles.json, so build it before the
      # suite runs. Doubles as a check that render.yaml's build command works.
      - name: Collect static files
        working-directory: backend
        env:
          DB_HOST: localhost
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py collectstatic --noinput

      - name: Run tests
        working-directory: backend
        # DB name/user/password/port fall through to the settings defaults,
        # which match the postgres service env above. pytest-django creates
        # and destroys its own test_gamedev_db.
        #
        # DEBUG is deliberately left unset so the suite runs under the
        # production default (False); SECRET_KEY satisfies the settings guard
        # that pairs with it. USE_HTTPS stays unset, so no SSL redirects.
        env:
          DB_HOST: localhost
          SECRET_KEY: ci-test-secret-key-not-for-production
          # TRUST_CF_HEADERS defaults to `not DEBUG`, and DEBUG is deliberately
          # unset above — which would silently flip it ON for the whole CI run,
          # the opposite of the dev/test default the setting documents. Pinned
          # off so tests exercise the same trust boundary they do locally;
          # the trusted path is opted into per-test with override_settings.
          TRUST_CF_HEADERS: 'False'
        run: pytest

      # Phase 55 (A8). The audit that opened this phase found CVEs in
      # django-allauth, simplejwt, pyjwt and pillow that had been patched
      # upstream for months, because nothing was checking. This is that check.
      #
      # Scoped to requirements.txt rather than the whole environment on
      # purpose: auditing the environment also reports the CI runner's own
      # `pip`, which is not an application dependency and whose advisories we
      # cannot act on from here.
      #
      # Note this is STRICTER than the spec's "fail on HIGH": pip-audit has no
      # severity filter, so this fails on any known advisory of any severity in
      # a declared dependency. That is the intended bar for a 5-user app with
      # fully pinned requirements, but it does mean one new LOW advisory reds
      # every PR — hence the allowlist slot below, mirroring the npm side.
      - name: Audit backend dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          # Reviewed exceptions go here as repeated --ignore-vuln flags, each
          # with a comment saying why and when to remove it. Empty today.
          #   e.g. --ignore-vuln GHSA-xxxx-xxxx-xxxx \
          pip-audit --requirement requirements.txt

  frontend:
    name: Frontend (tsc, lint, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      # Phase 55 (A8). `--omit=dev` scopes this to what actually ships to a
      # browser; the remaining dev-only advisories (the eslint -> minimatch /
      # brace-expansion chain) are build-time tooling with no runtime exposure
      # and are tracked in the phase 55 spec's follow-ups.
      #
      # ACCEPTED_ADVISORIES is a deliberate, reviewed exception list — the
      # point is that CI stays green while the debt stays visible, not that
      # the finding disappears. Anything high or critical that is NOT on this
      # list fails the build. Removing an entry is how the debt gets paid.
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          # GHSA-qwww-vcr4-c8h2 — React Router RSC-mode CSRF. Fixed only in
          # react-router 8.3.0, which requires React >=19.2.7; this app is on
          # React 18, so the fix is a React major, deferred to phase 56b. Not
          # reachable here regardless: this is a declarative SPA with no RSC,
          # no server rendering and no router actions.
          ACCEPTED_ADVISORIES="GHSA-qwww-vcr4-c8h2"
          export ACCEPTED_ADVISORIES
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const accepted = new Set(process.env.ACCEPTED_ADVISORIES.split(/\s+/).filter(Boolean));
            const report = require("./audit.json");
            // `npm audit ... || true` above masks the exit code so a real
            // report with findings does not kill the step. That also means a
            // registry outage or auth failure yields {"error": ...} with no
            // `vulnerabilities` key, which would otherwise scan clean and pass.
            // A supply-chain gate that goes green on infrastructure failure is
            // not a gate, so require a usable report first.
            if (!report.metadata || !report.auditReportVersion) {
              console.error("npm audit did not produce a usable report:",
                JSON.stringify(report.error || report).slice(0, 500));
              process.exit(1);
            }
            const unexpected = [];
            for (const [name, vuln] of Object.entries(report.vulnerabilities || {})) {
              if (!["high", "critical"].includes(vuln.severity)) continue;
              for (const via of vuln.via) {
                if (typeof via === "string") continue;
                const id = (via.url || "").split("/").pop();
                if (!accepted.has(id)) unexpected.push(`${name}: ${via.title} (${via.url})`);
              }
            }
            if (unexpected.length) {
              console.error("Unaccepted high/critical advisories:");
              for (const line of unexpected) console.error("  - " + line);
              process.exit(1);
            }
            console.log("No unaccepted high/critical runtime advisories.");
          '

      - name: Production build
        working-directory: frontend
        # Deliberately overlaps the type check (build runs `tsc -b`): this
        # proves the exact Vite production bundle Cloudflare Pages will run
        # compiles. Since Phase 39, vite.config.ts fails production builds
        # that lack VITE_API_URL (so Pages can't ship a site pointed at
        # localhost) — CI satisfies the guard with a dummy value.
        env:
          VITE_API_URL: "http://localhost:8000/api"
        run: npm run build
