# Phase 73 (A7): secret scanning.
#
# The phase 73 audit found item 1 (secrets in repo / git history) clean —
# only `.env.example` placeholders are tracked and `.env` was never
# committed on any branch. That was a point-in-time human check. This
# workflow is what keeps it true.
#
# Deliberately a separate file from ci.yml: this gate is about the *repo*,
# not about the backend or frontend build, and it must keep running even
# while those are being reworked.
#
# Coverage — the three scans below are not redundant:
#   1. gitleaks-action  scans only the commits in this push / PR. Fast,
#                       annotates the run summary, and is the check most
#                       likely to name the commit that introduced a leak.
#   2. full history     scans every commit reachable from every ref. Catches
#                       a secret that landed on a branch which was later
#                       force-pushed over, rebased away, or merged from a
#                       fork — none of which appear in (1).
#   3. working tree     scans the checked-out files as they are on disk.
#                       Catches a secret present in the tree but not in any
#                       diff this run looked at.
# Any one of them finding something fails the build, which is the point.
#
# Rules and reviewed false positives live in `.gitleaks.toml` at the repo
# root. Read the header there before adding an exception.
#
# No GITLEAKS_LICENSE secret is needed: the license is only required for
# repos owned by an organization account, and Cesar6060/LMS is a personal
# account. If the repo is ever transferred to an org, the action starts
# failing with a "missing gitleaks license" error — that is the fix, not a
# reason to drop the step.

name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Read-only. Nothing here writes to the repo, and PR review comments are
# switched off below precisely so this does not need `pull-requests: write`.
permissions:
  contents: read

# One run per ref; a new push cancels the in-flight run for that ref.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (commits, history, working tree)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # gitleaks-action resolves a PR's commit range through
      # `GET /repos/{owner}/{repo}/pulls/{n}/commits`. Without this the call
      # 403s and every PR run fails on an API error rather than on a finding.
      pull-requests: read

    env:
      # Pin the scanner itself, not just the action wrapper — the action
      # otherwise falls back to its own hardcoded default version, so the
      # ruleset could shift under us without any change to this file.
      # 8.30.1 is the version the `.gitleaks.toml` allowlists were verified
      # against; re-verify them when bumping this.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_CONFIG: .gitleaks.toml

    steps:
      # fetch-depth: 0 is load-bearing twice over: the full-history scan has
      # nothing to walk without it, and it is what populates the
      # refs/remotes/origin/* that `--log-opts=--all` expands to.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the commits in this push or pull request
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Posting review comments needs `pull-requests: write`, which this
          # workflow deliberately does not hold. Findings surface in the job
          # summary, the step log and the uploaded SARIF instead.
          GITLEAKS_ENABLE_COMMENTS: 'false'

      # The two steps below reuse the gitleaks binary the action just put on
      # PATH — same pinned version, no second download. The action installs
      # before it dispatches on the event type, so the binary is there even
      # on a push it decides it has no commits to scan.
      #
      # `!cancelled()` rather than `always()`: if the step above fails, we
      # still want the broader scans to report (the build is already red),
      # but a cancelled run should stop.

      - name: Scan the full git history
        if: ${{ !cancelled() }}
        run: |
          gitleaks git . \
            --log-opts='--all' \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1

      - name: Scan the working tree
        if: ${{ !cancelled() }}
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1
