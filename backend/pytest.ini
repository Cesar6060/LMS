[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_test.py
# Phase 55 (D2): pytest-cov has been installed since phase 12 but was never
# switched on, so coverage had never been measured. Reporting only — no
# --cov-fail-under threshold in this phase. Measure first, gate in a later one
# once the baseline has settled.
addopts = -v --tb=short --cov=. --cov-report=term-missing
markers =
    # Phase 73: opt back into rate limiting for a test. Throttling is disabled
    # by default (see conftest.py) so real defaults do not 429 the suite.
    throttled: run this test with throttling active
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Must stay last: pytest applies filters in order and the last match wins.
    # RemovedInDjango60Warning subclasses DeprecationWarning, so an ignore line
    # appended below this one would silently disable the error gate.
    error::django.utils.deprecation.RemovedInDjango60Warning
